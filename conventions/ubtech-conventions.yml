description: >-
  Cross-cutting request/response semantics for the Yanshee Open ADK REST API,
  derived from the published Swagger 2.0 definition in the UBTEDU/Yan_ADK
  repository. The Yanshee robot exposes a device-local HTTP API (documented
  host form http://<robot-ip>:9090/v1); the Open ADK subscription surface
  receives data pushed from the robot to a local callback server
  (documented as 127.0.0.1:10101 in the spec).
