aid: ubtech
name: UBTech
description: >-
  UBTech Robotics is a Shenzhen-based robotics company building humanoid
  robots (the Walker series), commercial service robots (Cruzr, CADEBOT),
  AI education robots and kits (Yanshee, uKit, UGOT, Jimu), and consumer
  smart hardware (Alpha robots, AIRROBO). Its developer surface centers on
  the Yanshee educational humanoid, an open Raspberry Pi-based robot that
  exposes a device-local REST API (Yanshee Open ADK, Swagger 2.0) with an
  on-robot Swagger UI, a push-based subscription event surface, and Python,
  C, and Arduino SDKs published through the UBTEDU GitHub organization.
